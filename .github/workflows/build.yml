name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build and push images to Artifact Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write   # required for GCP auth

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nordspot-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            europe-north1-docker.pkg.dev/nordspot1/nordspot/nordspot-api:latest
            europe-north1-docker.pkg.dev/nordspot1/nordspot/nordspot-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nordspot-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            europe-north1-docker.pkg.dev/nordspot1/nordspot/nordspot-dashboard:latest
            europe-north1-docker.pkg.dev/nordspot1/nordspot/nordspot-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write job summary
        if: success()
        run: |
          echo "## Build — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| nordspot-api | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| nordspot-dashboard | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
